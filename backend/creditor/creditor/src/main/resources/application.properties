# Server configuration
server.port=${PORT:8081}

# Spring Data / JPA / PostgreSQL (Supabase)
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/creditor}}
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP pool settings (optimized for serverless / poolers)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# CrediTOR Security & JWT
creditor.jwt.secret=${CREDITOR_JWT_SECRET:creditor-secure-jwt-signing-secret-key-32chars-minimum-2024}
creditor.jwt.expiry-hours=${CREDITOR_JWT_EXPIRY_HOURS:24}

# File storage
creditor.upload.dir=${CREDITOR_UPLOAD_DIR:./uploads}

# OCR & AI Photo verification
creditor.ocrspace.api-key=${OCR_SPACE_API_KEY:}
creditor.ocrspace.max-image-edge=1200
creditor.ocrspace.engine=2
creditor.gemini.api-key=${GEMINI_API_KEY:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
